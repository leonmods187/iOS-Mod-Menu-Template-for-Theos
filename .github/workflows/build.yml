name: Build iOS Mod Menu

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install ldid dpkg make

    - name: Setup Theos
      run: |
        git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
        git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

    - name: Verify Setup
      run: |
        test -f $THEOS/makefiles/common.mk && echo "OK: common.mk gefunden"
        ls $THEOS/sdks
        make --version | head -1

    - name: Compile
      run: make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-Deb
        path: packages/*.deb
        if-no-files-found: error
