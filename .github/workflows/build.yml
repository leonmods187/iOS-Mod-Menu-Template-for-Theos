name: Build iOS Mod Menu

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Theos & SDK
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        # Offizielles SDK herunterladen (iPhoneOS11.2.sdk)
        mkdir -p $HOME/theos/sdks
        git clone https://github.com/theos/sdk-11.2.git $HOME/theos/sdks/iPhoneOS11.2.sdk || git clone https://github.com/iphoneos-sdk/iphoneos-sdk.git $HOME/theos/sdks/temp && mv $HOME/theos/sdks/temp/iPhoneOS11.2.sdk $HOME/theos/sdks/ || true

    - name: Build Dylib
      run: |
        make package THEOS_PACKAGE_SCHEME=rootless MOBILE_THEOS=0

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-Dylib
        path: ./*.dylib
