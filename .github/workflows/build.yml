name: Build iOS Mod Menu

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install ldid dpkg make

    - name: Setup Theos
      run: |
        git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

    - name: Prepare project files
      working-directory: template
      run: |
        if [ -f '@@PROJECTNAME@@.plist' ]; then mv '@@PROJECTNAME@@.plist' ModMenu.plist; fi
        ls -la
        echo "--- Platzhalter-Check (sollte 'keine' ausgeben):"
        grep -n '@@' Makefile control ModMenu.plist || echo "keine"

    - name: Compile
      working-directory: template
      run: make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-Deb
        path: template/packages/*.deb
        if-no-files-found: error
