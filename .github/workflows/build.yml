name: Build iOS Mod Menu

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Theos and Build
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        
        # SDK herunterladen, damit der Compiler nicht abbricht
        mkdir -p $THEOS/sdks
        git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks_temp
        mv $THEOS/sdks_temp/* $THEOS/sdks/
        rm -rf $THEOS/sdks_temp
        
        # Projekt kompilieren (unterdrückt Fehler bei fehlenden optionalen Verknüpfungen)
        make package THEOS_PACKAGE_SCHEME=rootless MOBILE_THEOS=0 IGNORE_WARNINGS=1 || make package MOBILE_THEOS=0 IGNORE_WARNINGS=1
      env:
        THEOS: /Users/runner/theos

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-Dylib
        path: ./*.deb
        if-no-files-found: ignore
