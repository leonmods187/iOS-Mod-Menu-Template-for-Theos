name: Build iOS Mod Menu

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS

    - name: Setup SDKs
      run: |
        export THEOS=$HOME/theos
        git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
        ls $THEOS/sdks | head -20

    - name: Verify Setup
      run: |
        export THEOS=$HOME/theos
        test -f $THEOS/makefiles/common.mk && echo "OK: common.mk gefunden" || (echo "FEHLER: theos nicht korrekt gecloned"; exit 1)

    - name: Compile
      run: |
        export THEOS=$HOME/theos
        make package MOBILE_THEOS=0 ARCHS=arm64 THEOS=$THEOS

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-Deb
        path: packages/*.deb
        if-no-files-found: error
