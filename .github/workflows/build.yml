name: Build iOS Mod Menu

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Theos and Compile
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        
        # SDKs vorbereiten
        mkdir -p $THEOS/sdks
        git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks_temp || true
        cp -r $THEOS/sdks_temp/* $THEOS/sdks/ 2>/dev/null || true
        
        # Make mit explizitem THEOS-Pfad ausführen
        make package THEOS_PACKAGE_SCHEME=rootless MOBILE_THEOS=0 THEOS=$THEOS
      env:
        THEOS: /Users/runner/theos

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-Dylib
        path: ./*.deb
        if-no-files-found: ignore
